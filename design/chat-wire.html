<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>chat concept — wire v5 (flowing transcript)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#0e0e0e; --panel:#191919; --bd:#2b2b2b; --bd2:#3a2e16; --fg:#e6e6e6; --muted:#7a7a7a; --amber:#e0992e;
    --mono:"JetBrains Mono",ui-monospace,monospace; --sans:"Helvetica Neue",Arial,sans-serif; --serif:"Newsreader",Georgia,serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);padding:56px 24px 120px}
  .wrap{max-width:1120px;margin:0 auto}
  .kick{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
  h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:.2em 0 0}
  .lead{color:var(--muted);max-width:560px;margin:14px 0 0}

  .stage{position:relative;margin-top:44px;height:380px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
  .rail{position:absolute;left:0;right:0;top:190px;height:1px;background:var(--bd)}
  #world{position:absolute;inset:0;transition:transform .6s cubic-bezier(.33,1,.5,1)}

  .card{position:absolute;width:250px}
  .card .stem{position:absolute;left:18px;width:1px;background:var(--bd)}
  .card .box{position:relative;border:1px solid var(--bd);background:var(--panel);border-radius:6px;padding:10px 13px;
    font-size:13.5px;line-height:1.5;overflow:hidden;max-height:96px;transition:max-height .3s ease,border-color .2s,background .2s}
  .card .box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
    background:linear-gradient(transparent,var(--panel));transition:opacity .2s}
  .card .box:hover{max-height:340px} .card .box:hover::after{opacity:0}
  .card .who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:4px}
  .card.prt .who{color:var(--amber)}
  .card.prt .box{border-color:var(--bd2);background:#1c1712}
  .card.prt .box::after{background:linear-gradient(transparent,#1c1712)}
  /* you hangs below the line, parrot perches above it */
  .card.you{top:202px} .card.you .stem{top:-12px;height:12px}
  .card.prt{bottom:202px} .card.prt .stem{bottom:-12px;height:12px}
  /* freshest beat is brighter; older fade back */
  .card.dim .box{opacity:.5}

  #pwrap{position:absolute;top:0;z-index:4;pointer-events:none}
  #pwrap canvas{image-rendering:pixelated;display:block}

  .bar{display:flex;align-items:center;gap:12px;max-width:680px;margin:28px auto 0;border:1px solid var(--bd);border-radius:6px;padding:12px 16px;transition:border-color .2s}
  .bar:focus-within{border-color:var(--bd2)}
  .bar .p{color:var(--amber);font-family:var(--mono)}
  .bar input{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font-family:var(--mono);font-size:14px}
  .bar input::placeholder{color:var(--muted)}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .chips button{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--bd);background:transparent;border-radius:3px;padding:5px 10px;cursor:pointer;transition:.2s}
  .chips button:hover{color:var(--amber);border-color:var(--bd2)}
  .hint{text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <p class="kick">[06] concept · wire v5</p>
  <h1>Ask the parrot</h1>
  <p class="lead">The conversation weaves along the wire — you below the line, the parrot above. It perches at the live end and hops as answers land.</p>

  <div class="stage" id="stage">
    <div class="rail"></div>
    <div id="world"></div>
    <div id="pwrap"><canvas id="parrot"></canvas></div>
  </div>

  <div class="bar"><span class="p">›</span><input id="in" placeholder="ask about on-call, k8s, or me…" autocomplete="off" /><span style="color:var(--muted);font-family:var(--mono)">↵</span></div>
  <div class="chips" id="chips"></div>
  <p class="hint">hover a card to expand · scroll the wire left for history</p>
</div>

<script>
const AMBER=[224,153,46], FULL={w:40,h:46};
function drawFull(c,o){
  c.clearRect(0,0,FULL.w,FULL.h); c.fillStyle="#fff"; const lift=o.crestUp||0, tf=o.tailFlick||0, es=o.eyeShift||0;
  c.beginPath(); c.ellipse(23,24,9,12,0,0,7); c.fill();
  c.beginPath(); c.arc(18,13,9,0,7); c.fill();
  c.beginPath(); c.moveTo(20,5); c.lineTo(32,2-lift); c.lineTo(23,13); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(17,4); c.lineTo(26,2-lift); c.lineTo(21,11); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(13,10); c.lineTo(6,12); c.lineTo(5,17); c.lineTo(9,16); c.lineTo(12,14); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(22,33); c.lineTo(33,30); c.lineTo(28+tf,46); c.lineTo(21,44); c.closePath(); c.fill();
  c.strokeStyle="#fff"; c.lineWidth=1.6; c.beginPath(); c.moveTo(17,34); c.lineTo(17,40); c.moveTo(23,34); c.lineTo(23,40); c.stroke();
  if(o.mouth==="open"){ c.beginPath(); c.moveTo(6,18); c.lineTo(10,18); c.lineTo(10,21); c.lineTo(7,21); c.closePath(); c.fill();
    c.globalCompositeOperation="destination-out"; c.fillRect(5,17,7,1.1); c.globalCompositeOperation="source-over"; }
  c.globalCompositeOperation="destination-out";
  if(o.eye==="closed") c.fillRect(15+es,11.4,6,1.4); else { c.beginPath(); c.arc(17+es,11.6,2.2,0,7); c.fill(); }
  c.lineWidth=1.6; c.beginPath(); c.moveTo(22,17); c.quadraticCurveTo(29,22,27,31); c.stroke();
  c.globalCompositeOperation="source-over";
}
function sbase(o){
  const off=document.createElement("canvas"); off.width=FULL.w; off.height=FULL.h; drawFull(off.getContext("2d"),o);
  const src=off.getContext("2d").getImageData(0,0,FULL.w,FULL.h).data;
  const b=document.createElement("canvas"); b.width=FULL.w; b.height=FULL.h; const bc=b.getContext("2d"), img=bc.createImageData(FULL.w,FULL.h);
  for(let y=0;y<FULL.h;y++)for(let x=0;x<FULL.w;x++){const i=(y*FULL.w+x)*4; if(src[i+3]>128){ if(src[i]<=200&&((x+y)&1))continue;
    img.data[i]=AMBER[0];img.data[i+1]=AMBER[1];img.data[i+2]=AMBER[2];img.data[i+3]=255; }}
  bc.putImageData(img,0,0); return b;
}
const SCALE=2, FEET=40, RAIL_Y=190, pc=document.getElementById("parrot");
pc.width=FULL.w*SCALE; pc.height=FULL.h*SCALE; const pctx=pc.getContext("2d"); pctx.imageSmoothingEnabled=false;
const pwrap=document.getElementById("pwrap");
let sprState="online", look=0, st=0;
setInterval(()=>{ st+=66; let o;
  if(sprState==="talk") o={mouth:Math.floor(st/200)%2?"open":"closed", eye:st%3000<130?"closed":"open"};
  else o={eye:st%3000<130?"closed":"open", tailFlick:st%5200<260?2:0, crestUp:st%8000<420?2:0, eyeShift:look};
  pctx.clearRect(0,0,pc.width,pc.height); pctx.drawImage(sbase(o),0,0,pc.width,pc.height);
},66);

const START=70, GAP=205;
const stage=document.getElementById("stage"), world=document.getElementById("world"), input=document.getElementById("in");
let cards=[];
const worldX=i=>START+i*GAP;
function add(role,text){
  const i=cards.length, el=document.createElement("div");
  el.className="card "+(role==="parrot"?"prt":"you"); el.style.left=worldX(i)+"px";
  el.innerHTML='<div class="stem"></div><div class="box"><span class="who">'+(role==="parrot"?"parrot":"you")+'</span>'+text+'</div>';
  world.appendChild(el); cards.push({el});
  // freshness: only the last 2 are bright
  cards.forEach((c,k)=>c.el.classList.toggle("dim", k < cards.length-2));
  // camera: newest card lands left-of-centre, leaving clear wire to its right for the perch
  const W=stage.clientWidth, camX = Math.min(0, W*0.56 - worldX(i));
  world.style.transform="translateX("+camX+"px)";
  // perch on BARE wire just past the newest card's right edge (250 wide), never on a card
  parrotTo(worldX(i)+camX + 250 + 30);
}
const replies=[
  "A pager should mean a human has to decide something right now. Everything else is a ticket — or an automation I still owe you.",
  "k3s, not full k8s — five Talos nodes in a cupboard in Münster. It's where the bad ideas go first.",
  "Honestly? Hire me to make your on-call boring. That is the entire pitch.",
  "That's outside what I've parroted. Ask the real one — he answers email.",
];
let r=0;
function ask(q){ if(!q.trim())return; add("you",q); sprState="talk";
  setTimeout(()=>{ add("parrot",replies[r++%replies.length]); sprState="online"; },950); }

// ---- parrot kinematics: lives at the live end, organic idle + greeting hops ----
let pPos=null, hop=0, facing=-1, hopping=false,hf=0,ht=0,hT=0,hDur=0,hH=0,pause=0,idle=0, last=performance.now();
function parrotTo(x){ pTarget=x; }
let pTarget=stage.clientWidth*0.86;
function loop(now){
  const dt=Math.min(48,now-last); last=now;
  if(pPos===null) pPos=pTarget;
  if(!hopping){
    if(pause>0) pause-=dt;
    else if(Math.abs(pTarget-pPos)>5){
      const dir=Math.sign(pTarget-pPos), step=dir*Math.min(Math.abs(pTarget-pPos),70+Math.random()*60);
      hf=pPos; ht=pPos+step; hT=0; hDur=200+Math.random()*150; hH=16+Math.random()*16; facing=dir; hopping=true;
    } else {
      facing=-1; idle-=dt;
      if(idle<=0){ idle=1300+Math.random()*3200; const roll=Math.random();
        if(roll<0.5){ hf=pPos; ht=pPos+(Math.random()*8-4); hT=0; hDur=180+Math.random()*120; hH=7+Math.random()*7; hopping=true; }
        else { look=(Math.random()<0.5?-1:1); setTimeout(()=>look=0,400+Math.random()*500); }
      }
    }
  }
  if(hopping){ hT+=dt; const u=Math.min(1,hT/hDur);
    pPos=hf+(ht-hf)*(1-Math.pow(1-u,2)); hop=Math.sin(u*Math.PI)*hH;
    if(u>=1){ hopping=false; hop=0; pause=40+Math.random()*150; }
  }
  pwrap.style.left=(pPos-pc.width/2)+"px";
  pwrap.style.top=(RAIL_Y-FEET*SCALE)+"px";
  pc.style.transform="translateY("+(-hop)+"px) scaleX("+facing+")";
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ ask(input.value); input.value=""; }});
["on-call philosophy","k8s at home?","why hire you?"].forEach(ch=>{
  const b=document.createElement("button"); b.textContent=ch; b.onclick=()=>ask(ch); document.getElementById("chips").appendChild(b); });
// seed a short exchange so the flow is visible immediately
add("you","what's your on-call philosophy?");
setTimeout(()=>add("parrot",replies[0]),350);
setTimeout(()=>add("you","do you actually run k8s at home?"),700);
setTimeout(()=>add("parrot",replies[1]),1050);
</script>
</body>
</html>
